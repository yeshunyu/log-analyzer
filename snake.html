<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a2e;
    font-family: 'Courier New', monospace;
  }
  .game-wrapper {
    text-align: center;
  }
  h1 {
    color: #e94560;
    margin-bottom: 10px;
    font-size: 32px;
    letter-spacing: 4px;
  }
  .score-board {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 10px;
  }
  .score-item {
    color: #eee;
    font-size: 18px;
  }
  .score-item span {
    color: #0f3460;
    background: #e94560;
    padding: 2px 10px;
    border-radius: 4px;
    font-weight: bold;
  }
  canvas {
    border: 2px solid #e94560;
    border-radius: 4px;
    background: #16213e;
    display: block;
  }
  .controls {
    color: #888;
    margin-top: 12px;
    font-size: 14px;
  }
  .game-over-msg {
    color: #e94560;
    font-size: 20px;
    margin-top: 8px;
    min-height: 28px;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <h1>贪 吃 蛇</h1>
  <div class="score-board">
    <div class="score-item">得分: <span id="score">0</span></div>
    <div class="score-item">最高: <span id="highScore">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="game-over-msg" id="msg"></div>
  <div class="controls">方向键 / WASD 控制方向 &nbsp;|&nbsp; 空格键 暂停/继续 &nbsp;|&nbsp; R 键重新开始</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const msgEl = document.getElementById('msg');

const GRID = 20;
const COLS = 30;
const ROWS = 25;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

let snake, food, dir, nextDir, score, highScore, gameOver, paused, speed, timer;

highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
highScoreEl.textContent = highScore;

function init() {
  snake = [
    { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
    { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
    { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  paused = false;
  speed = 120;
  scoreEl.textContent = score;
  msgEl.textContent = '';
  placeFood();
  if (timer) clearInterval(timer);
  timer = setInterval(loop, speed);
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const free = [];
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    }
  }
  if (free.length === 0) return;
  food = free[Math.floor(Math.random() * free.length)];
}

function loop() {
  if (gameOver || paused) return;

  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame();
    return;
  }
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    // speed up
    if (speed > 50) {
      speed -= 2;
      clearInterval(timer);
      timer = setInterval(loop, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  clearInterval(timer);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
    highScoreEl.textContent = highScore;
    msgEl.textContent = '🎉 新纪录！按 R 重新开始';
  } else {
    msgEl.textContent = '游戏结束！按 R 重新开始';
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * GRID, 0);
    ctx.lineTo(x * GRID, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * GRID);
    ctx.lineTo(canvas.width, y * GRID);
    ctx.stroke();
  }

  // food
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((s, i) => {
    const alpha = 1 - i / (snake.length + 10);
    const r = 10, g = 200, b = 80;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    const pad = 1;
    const radius = 4;
    const x = s.x * GRID + pad;
    const y = s.y * GRID + pad;
    const w = GRID - pad * 2;
    const h = GRID - pad * 2;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();

    // head eyes
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const ex = s.x * GRID + GRID / 2;
      const ey = s.y * GRID + GRID / 2;
      const eo = 4;
      if (dir.x === 1) { ctx.fillRect(ex + eo - 1, ey - eo, 3, 3); ctx.fillRect(ex + eo - 1, ey + 2, 3, 3); }
      else if (dir.x === -1) { ctx.fillRect(ex - eo - 2, ey - eo, 3, 3); ctx.fillRect(ex - eo - 2, ey + 2, 3, 3); }
      else if (dir.y === -1) { ctx.fillRect(ex - eo, ey - eo - 2, 3, 3); ctx.fillRect(ex + 2, ey - eo - 2, 3, 3); }
      else if (dir.y === 1) { ctx.fillRect(ex - eo, ey + eo - 1, 3, 3); ctx.fillRect(ex + 2, ey + eo - 1, 3, 3); }
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    init();
    return;
  }
  if (e.key === ' ') {
    e.preventDefault();
    if (!gameOver) {
      paused = !paused;
      msgEl.textContent = paused ? '已暂停' : '';
    }
    return;
  }
  if (gameOver || paused) return;
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W':
      if (dir.y !== 1) nextDir = { x: 0, y: -1 };
      break;
    case 'ArrowDown': case 's': case 'S':
      if (dir.y !== -1) nextDir = { x: 0, y: 1 };
      break;
    case 'ArrowLeft': case 'a': case 'A':
      if (dir.x !== 1) nextDir = { x: -1, y: 0 };
      break;
    case 'ArrowRight': case 'd': case 'D':
      if (dir.x !== -1) nextDir = { x: 1, y: 0 };
      break;
  }
});

init();
draw();
</script>
</body>
</html>
