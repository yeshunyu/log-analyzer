<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.deepseek.com https://api.openai.com; style-src 'self' 'unsafe-inline';">
<title>LogScope - Linux Log Analyzer</title>
<style>
/* === Theme Variables === */
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-input: #0d1117;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --info: #58a6ff;
  --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

/* Theme: Ops Dark (默认) */
[data-theme="ops"] {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-input: #0d1117;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --info: #58a6ff;
  --card-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* Theme: Tech Blue */
[data-theme="tech"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --bg-input: #0f0f23;
  --border: #333;
  --text-primary: #eee;
  --text-secondary: #888;
  --text-muted: #666;
  --accent: #00d4ff;
  --accent-hover: #00ff88;
  --success: #2ed573;
  --warning: #ffa502;
  --danger: #ff4757;
  --info: #00d4ff;
  --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

/* Theme: Light Minimal */
[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-input: #ffffff;
  --border: #d0d7de;
  --text-primary: #24292f;
  --text-secondary: #57606a;
  --text-muted: #8c959f;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --success: #1a7f37;
  --warning: #9a6700;
  --danger: #cf222e;
  --info: #0969da;
  --card-shadow: 0 2px 10px rgba(0,0,0,0.08);
}

/* === Reset & Base === */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* === Header === */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 1.5em;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.header h1 span { font-size: 0.5em; color: var(--text-muted); font-weight: 400; }

/* Theme Switcher */
.theme-switcher {
  display: flex;
  gap: 6px;
  background: var(--bg-secondary);
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.theme-btn {
  padding: 6px 12px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85em;
  transition: all 0.2s;
}
.theme-btn:hover { color: var(--text-primary); }
.theme-btn.active {
  background: var(--accent);
  color: #fff;
}

/* === Cards === */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
  transition: background 0.3s, border-color 0.3s;
}
.card-title {
  font-size: 1em;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title svg { opacity: 0.8; }
}

/* === Drop Zone === */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s;
  background: var(--bg-tertiary);
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--bg-secondary);
}

/* === Textarea === */
textarea {
  width: 100%;
  height: 180px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  padding: 14px;
  font-family: 'Monaco', 'Consolas', monospace;
  font-size: 13px;
  resize: vertical;
  margin-top: 12px;
  transition: border-color 0.2s, background 0.3s;
}
textarea:focus { outline: none; border-color: var(--accent); }

/* === Form Elements === */
select, input[type="text"], input[type="password"] {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  padding: 8px 12px;
  font-size: 0.9em;
  transition: border-color 0.2s;
}
select:focus, input:focus { outline: none; border-color: var(--accent); }
.config-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  align-items: center;
  flex-wrap: wrap;
}

/* === Buttons === */
.btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
button {
  background: var(--accent);
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
button:hover { filter: brightness(1.1); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.secondary {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
button.secondary:hover { background: var(--border); }

/* === Stats Cards === */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 10px;
  text-align: center;
}
.stat-card .num { font-size: 2em; font-weight: 700; line-height: 1.2; }
.stat-card .label { font-size: 0.8em; color: var(--text-secondary); margin-top: 4px; }
.stat-card.critical .num { color: var(--danger); }
.stat-card.warning .num { color: var(--warning); }
.stat-card.info .num { color: var(--success); }

/* === Issue Cards === */
.results { display: grid; gap: 12px; }
.issue-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  border-left: 4px solid;
}
.issue-card.critical { border-color: var(--danger); }
.issue-card.warning { border-color: var(--warning); }
.issue-card.info { border-color: var(--success); }
.issue-card .header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.issue-card .time { color: var(--text-muted); font-size: 0.85em; }
.issue-card .tag {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75em;
  font-weight: 600;
}
.tag.critical { background: var(--danger); color: #fff; }
.tag.warning { background: var(--warning); color: #000; }
.tag.info { background: var(--success); color: #fff; }
.tag.security { background: #f85149; color: #fff; }
.tag.performance { background: var(--success); color: #fff; }
.issue-card .content {
  color: var(--text-secondary);
  font-size: 0.9em;
  line-height: 1.6;
  word-break: break-all;
}
.issue-card .suggestion {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg-tertiary);
  border-radius: 6px;
  color: var(--accent);
  font-size: 0.85em;
  line-height: 1.5;
}

/* === LLM Summary === */
.llm-summary {
  background: var(--bg-secondary);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 20px;
  margin-top: 16px;
}
.llm-summary h3 {
  color: var(--accent);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1em;
}
.llm-summary .spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--accent);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.llm-summary pre {
  background: var(--bg-primary);
  padding: 16px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
  max-height: 400px;
  overflow-y: auto;
  font-size: 0.9em;
}
.llm-summary.error { border-color: var(--danger); }
.llm-summary.error h3 { color: var(--danger); }

/* === Chat === */
.chat-section {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-top: 16px;
}
.chat-section h3 { color: var(--accent); margin-bottom: 16px; font-size: 1em; }
.chat-messages { max-height: 350px; overflow-y: auto; margin-bottom: 16px; }
.chat-msg { margin-bottom: 12px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; }
.chat-msg.user { background: var(--bg-tertiary); text-align: right; }
.chat-msg.assistant { background: var(--bg-primary); border: 1px solid var(--border); }
.chat-msg.error { background: rgba(248,81,73,0.1); border: 1px solid var(--danger); color: var(--danger); }
.chat-input-row { display: flex; gap: 10px; }
.chat-input-row textarea { flex: 1; height: 56px; margin: 0; }
.chat-msg pre { white-space: pre-wrap; word-break: break-all; margin-top: 8px; font-size: 0.9em; }

/* === Collect Section === */
.collect-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.collect-section h3 { color: var(--accent); margin-bottom: 14px; font-size: 1em; display: flex; align-items: center; gap: 8px; }
.collect-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* === Misc === */
.empty { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 1.1em; }
.info-text { margin-top: 10px; font-size: 0.85em; color: var(--text-muted); }
.info-text code {
  background: var(--bg-primary);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--warning);
  font-family: 'Monaco', 'Consolas', monospace;
}
.disclaimer {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8em;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  margin-top: 30px;
}
.about-dropdown { position: relative; }
.about-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85em;
  transition: all 0.2s;
}
/* === Archive Tree === */
.tree-view {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-family: 'Monaco', 'Consolas', monospace;
  font-size: 13px;
  white-space: pre;
  overflow-x: auto;
  line-height: 1.5;
  max-height: 300px;
  overflow-y: auto;
  margin: 10px 0;
}
.archive-meta { color: var(--text-secondary); font-size: 0.85em; margin-bottom: 8px; }
.file-result-block {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin: 8px 0;
}
.file-result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
  cursor: pointer;
}
.file-result-header .badge {
  background: var(--bg-primary);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.8em;
  font-weight: 400;
  color: var(--text-secondary);
}
.file-result-empty { color: var(--text-muted); font-size: 0.85em; padding: 4px 0; }

.about-btn:hover { color: var(--text-primary); border-color: var(--accent); }
.about-panel {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
  z-index: 100;
  min-width: 280px;
}
.about-panel.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
    <h1 style="margin:0;">LogScope</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="theme-switcher" style="gap:4px;">
        <button class="theme-btn active" data-theme="ops" style="padding:5px 10px;font-size:0.8em;">Dark Ops</button>
        <button class="theme-btn" data-theme="tech" style="padding:5px 10px;font-size:0.8em;">Cyber Blue</button>
        <button class="theme-btn" data-theme="light" style="padding:5px 10px;font-size:0.8em;">Clean Light</button>
      </div>
      <div class="about-dropdown">
        <button class="about-btn" onclick="toggleAbout()">关于</button>
        <div class="about-panel" id="aboutPanel">
          <div style="padding:16px;min-width:280px;">
            <div style="font-size:1.1em;font-weight:600;color:var(--accent);margin-bottom:12px;">LogScope</div>
            <div style="color:var(--text-secondary);font-size:0.85em;line-height:1.6;margin-bottom:12px;">
              Linux 系统日志分析工具，支持 DeepSeek V4 智能分析和硬件问题诊断。
            </div>
            <div style="font-size:0.8em;color:var(--text-muted);margin-bottom:12px;">
              <div style="margin-bottom:4px;">版本: v0.3rc2</div>
              <div>⚠️ AI 分析结果仅供参考</div>
            </div>
            <a href="https://github.com/yeshunyu/log-analyzer" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:0.85em;text-decoration:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
              GitHub
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px;opacity:0.6;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div id="fileInfo" style="margin-bottom:8px;">拖拽日志文件到此处，或点击选择文件</div>
      <div style="font-size:0.8em;opacity:0.6;">支持格式: .log .txt .tar.gz .gz | syslog dmesg journalctl smartctl 等</div>
    </div>
    <input type="file" id="fileInput" style="display:none" accept=".log,.txt,.tar.gz,.gz,.bz2,.xz,*">
    <textarea id="logInput" placeholder="粘贴日志内容，或上传文件..."></textarea>
    <div id="archiveDisplay" style="display:none;"></div>
  </div>

  <div id="historySection" class="card" style="display:none;">
    <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 最近上传 <span id="historyCount"></span></div>
    <div id="historyList"></div>
  </div>

  <div class="card">
    <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 生成日志收集脚本</div>
    <div class="collect-row">
      <select id="historyDays">
        <option value="1">最近 1 天</option>
        <option value="3">最近 3 天</option>
        <option value="7" selected>最近 7 天</option>
        <option value="14">最近 14 天</option>
        <option value="30">最近 30 天</option>
      </select>
      <select id="collectLevel">
        <option value="basic">基础</option>
        <option value="hardware" selected>硬件</option>
        <option value="full">完整</option>
      </select>
      <button onclick="downloadCollectScript()">下载脚本</button>
    </div>
    <div class="info-text">
      脚本输出: <code>/tmp/system-logs-&lt;hostname&gt;-&lt;时间&gt;.tar.gz</code>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> LLM 配置</div>
    <div class="config-row">
      <select id="modelSelect">
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      </select>
      <input type="password" id="apiKey" placeholder="API Key" style="max-width: 180px;">
      <input type="text" id="apiUrl" placeholder="https://api.deepseek.com" style="max-width: 220px;">
      <button class="secondary" onclick="saveConfig()">保存</button>
    </div>
    <div class="config-row" style="margin-top:8px;">
      <label style="color:var(--text-secondary);font-size:0.9em;cursor:pointer;">
        <input type="checkbox" id="useLLM" checked style="margin-right:6px;">使用 LLM 分析
      </label>
    </div>
  </div>

  <div class="btn-row">
    <button onclick="analyzeLogs()" id="mainBtn">开始分析</button>
    <button class="secondary" onclick="clearAll()">清空</button>
    <button class="secondary" onclick="exportReport()" style="display:flex;align-items:center;gap:6px;">
      导出报告
      <select id="exportFormat" onchange="exportReport()" style="background:transparent;border:none;color:inherit;padding:0;font-size:0.9em;cursor:pointer;">
        <option value="md">.md</option>
        <option value="html">.html</option>
      </select>
    </button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
  <div class="llm-summary" id="llmSummary" style="display:none"></div>
  <div class="chat-section" id="chatSection" style="display:none">
    <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 和大模型对话</h3>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="输入问题，按 Enter 发送..."></textarea>
      <button onclick="sendChat()">发送</button>
      <button class="secondary" onclick="clearChat()">清空</button>
    </div>
  </div>

  <div class="disclaimer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    分析结果由 AI 生成，仅供参考。实际问题排查请结合日志原始内容自行判断。
  </div>
</div>
<script>
const rules = [
  { pattern: /oom\s*killer/i, type: 'performance', severity: 'critical', category: '内存', suggestion: 'OOM killer启动。检查: dmesg -T | grep -i oom, top/htop内存使用' },
  { pattern: /load\s*average/i, type: 'performance', severity: 'warning', category: 'CPU', suggestion: '系统负载偏高。uptime查看历史，top定位高负载进程' },
  { pattern: /iowait/i, type: 'performance', severity: 'warning', category: 'IO', suggestion: 'IO等待过高。iostat -x 2 5查看瓶颈' },
  { pattern: /out\s*of\s*memory/i, type: 'performance', severity: 'critical', category: '内存', suggestion: '内存耗尽。free -m, dmesg -T | grep memory' },
  { pattern: /disk\s*(full|space)/i, type: 'fault', severity: 'critical', category: '磁盘', suggestion: '磁盘空间不足。df -h, du -sh /*' },
  { pattern: /failed\s*password/i, type: 'security', severity: 'warning', category: '认证', suggestion: '密码失败尝试。检查/var/log/auth.log，考虑fail2ban' },
  { pattern: /authentication\s*failure/i, type: 'security', severity: 'warning', category: '认证', suggestion: '认证失败。排查暴力攻击来源IP' },
  { pattern: /sudo/i, type: 'security', severity: 'info', category: '权限', suggestion: 'sudo使用记录。正常，但与failed password连续出现需关注' },
  { pattern: /connection\s*refused/i, type: 'fault', severity: 'warning', category: '网络', suggestion: '连接被拒绝。systemctl status <服务名>' },
  { pattern: /network\s*(down|unreachable)/i, type: 'fault', severity: 'critical', category: '网络', suggestion: '网络故障。ip addr, ping网关' },
  { pattern: /service\s*(failed|stopped)/i, type: 'fault', severity: 'warning', category: '服务', suggestion: '服务异常。systemctl status <服务名>' },
  { pattern: /kernel\s*panic/i, type: 'fault', severity: 'critical', category: '系统', suggestion: '内核崩溃。dmesg, 确认硬件故障' },
  { pattern: /segfault/i, type: 'fault', severity: 'warning', category: '程序', suggestion: '段错误。dmesg | grep segfault' },
  { pattern: /permission\s*denied/i, type: 'security', severity: 'info', category: '权限', suggestion: '权限拒绝。检查文件权限和SELinux' },
  { pattern: /invalid\s*user/i, type: 'security', severity: 'warning', category: '认证', suggestion: '无效用户名登录尝试。可能的暴力破解' },
  { pattern: /CRON/i, type: 'info', severity: 'info', category: '定时任务', suggestion: 'CRON任务执行。正常系统行为' },
  { pattern: /sshd/i, type: 'security', severity: 'info', category: 'SSH', suggestion: 'SSH连接记录。检查异常IP访问' },
  { pattern: /\berror\b/i, type: 'fault', severity: 'warning', category: '错误', suggestion: '一般错误。结合上下文判断' },
  { pattern: /\bcritical\b/i, type: 'fault', severity: 'critical', category: '错误', suggestion: '严重错误。立即检查相关服务' },
  { pattern: /\bwarning\b/i, type: 'fault', severity: 'warning', category: '警告', suggestion: '警告信息。关注持续出现的情况' },
];

let currentResults = [], currentLogText = '', chatHistory = [], apiBaseUrl = '';
let currentArchive = null, currentFiles = [];

function parseLine(line) {
  const regex = /^(\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(\S+)\s+(\S+?)(?:\[(\d+)\])?:\s*(.*)$/;
  const m = line.match(regex);
  return m ? { time: m[1], host: m[2], proc: m[3], pid: m[4], msg: m[5], raw: line } : { time: '', host: '', proc: '', pid: '', msg: line, raw: line };
}

function analyzeLogs() {
  if (currentFiles.length > 0) {
    doPerFileAnalysis();
  } else {
    const input = document.getElementById('logInput').value.trim();
    if (!input) { alert('请输入日志内容或上传文件'); return; }
    currentLogText = input; currentResults = []; chatHistory = [];
    const statsDiv = document.getElementById('stats');
    statsDiv.innerHTML = '<div style="text-align:center;padding:20px;"><span class="spinner"></span> 规则解析中...</div>';
    document.getElementById('results').innerHTML = '';
    doRuleAnalysis();
    renderResults(currentResults);
    doLLMIfEnabled(currentLogText, currentResults);
  }
}

function doPerFileAnalysis() {
  currentResults = []; chatHistory = [];
  const perFileResults = [];
  const statsDiv = document.getElementById('stats');
  const resultsDiv = document.getElementById('results');
  statsDiv.innerHTML = '<div style="text-align:center;padding:20px;"><span class="spinner"></span> 逐文件扫描中...</div>';
  resultsDiv.innerHTML = '';

  currentFiles.forEach(f => {
    const fr = { path: f.path, size: f.size, results: [] };
    f.content.split('\n').forEach(line => {
      if (!line.trim()) return;
      const p = parseLine(line);
      rules.forEach(r => {
        if (r.pattern.test(p.msg) || r.pattern.test(p.raw)) {
          const hit = {...r, line: p.raw, time: p.time, host: p.host};
          fr.results.push(hit);
          currentResults.push(hit);
        }
      });
    });
    perFileResults.push(fr);
  });

  renderPerFileResults(perFileResults);

  // LLM
  doLLMIfEnabled(null, currentResults, perFileResults);
}

function renderPerFileResults(perFileResults) {
  const s = { critical: 0, warning: 0, info: 0 };
  currentResults.forEach(r => s[r.severity]++);
  document.getElementById('stats').innerHTML = `
    <div class="stat-card critical"><div class="num">${s.critical}</div><div class="label">严重</div></div>
    <div class="stat-card warning"><div class="num">${s.warning}</div><div class="label">警告</div></div>
    <div class="stat-card info"><div class="num">${s.info}</div><div class="label">信息</div></div>`;

  let html = '';
  perFileResults.forEach(fr => {
    html += `<div class="file-result-block">
      <div class="file-result-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <span>${escapeHtml(fr.path)} <span class="badge">${fr.results.length} 条 / ${formatSize(fr.size)}</span></span>
        <span style="font-size:0.8em;opacity:0.6;">▼</span>
      </div>
      <div class="file-result-body">`;
    if (fr.results.length === 0) {
      html += '<div class="file-result-empty">未检测到问题</div>';
    } else {
      html += fr.results.map(r => `
        <div class="issue-card ${r.severity}" style="margin:6px 0;">
          <div class="header">
            <span>${r.time ? `<span class="time">${r.time}</span> ` : ''}[${r.category}]</span>
            <span class="tag ${r.severity}">${r.severity}</span>
          </div>
          <div class="content">${escapeHtml(r.line)}</div>
          <div class="suggestion">${r.suggestion}</div>
        </div>`).join('');
    }
    html += '</div></div>';
  });
  document.getElementById('results').innerHTML = html;
}

function doLLMIfEnabled(logText, ruleResults, perFileResults) {
  const useLLM = document.getElementById('useLLM').checked;
  const llmSummary = document.getElementById('llmSummary');
  if (!useLLM) { document.getElementById('mainBtn').disabled = false; return; }
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { llmSummary.style.display = 'none'; alert('请先输入 API Key'); return; }
  document.getElementById('mainBtn').disabled = true;
  llmSummary.style.display = 'block';
  llmSummary.innerHTML = '<h3><span class="spinner"></span> AI 分析中...</h3><pre>正在调用大模型进行分析...</pre>';
  document.getElementById('chatSection').style.display = 'block';
  document.getElementById('chatMessages').innerHTML = '';
  callLLM(logText, ruleResults, perFileResults);
}

function doRuleAnalysis() {
  currentLogText.split('\n').forEach(line => {
    if (!line.trim()) return;
    const p = parseLine(line);
    rules.forEach(r => { if (r.pattern.test(p.msg) || r.pattern.test(p.raw)) currentResults.push({...r, line: p.raw, time: p.time, host: p.host}); });
  });
  renderResults(currentResults);
  document.getElementById('mainBtn').disabled = false;
}

function renderResults(results) {
  const s = { critical: 0, warning: 0, info: 0 };
  results.forEach(r => s[r.severity]++);
  document.getElementById('stats').innerHTML = `
    <div class="stat-card critical"><div class="num">${s.critical}</div><div class="label">严重</div></div>
    <div class="stat-card warning"><div class="num">${s.warning}</div><div class="label">警告</div></div>
    <div class="stat-card info"><div class="num">${s.info}</div><div class="label">信息</div></div>`;
  if (!results.length) { document.getElementById('results').innerHTML = '<div class="empty">未检测到问题模式</div>'; return; }
  document.getElementById('results').innerHTML = results.map(r => `
    <div class="issue-card ${r.severity}">
      <div class="header">
        <span>${r.time ? `<span class="time">${r.time}</span> ` : ''}${r.host ? `@${r.host} ` : ''}[${r.category}]</span>
        <span class="tag ${r.severity}">${r.severity}</span>
      </div>
      <div class="content">${escapeHtml(r.line)}</div>
      <div class="suggestion"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> ${r.suggestion}</div>
    </div>`).join('');
}

function getApiUrl() {
  const u = apiBaseUrl || 'https://api.deepseek.com';
  return u.endsWith('/v1/chat/completions') ? u : u + '/v1/chat/completions';
}

async function callLLM(logText, ruleResults, perFileResults) {
  try {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { alert('请先输入 API Key'); return; }
    apiBaseUrl = document.getElementById('apiUrl').value.trim();
    if (apiBaseUrl && !apiBaseUrl.startsWith('https://')) {
      alert('警告: API URL 建议使用 https://，否则 API Key 可能明文泄露！');
    }
    const model = document.getElementById('modelSelect').value;
    const summaryDiv = document.getElementById('llmSummary');

    let ruleSummary;
    if (perFileResults && perFileResults.length > 0) {
      ruleSummary = `逐文件扫描完成，共 ${ruleResults.length} 个问题：\n` +
        `严重: ${ruleResults.filter(r => r.severity === 'critical').length} | ` +
        `警告: ${ruleResults.filter(r => r.severity === 'warning').length} | ` +
        `信息: ${ruleResults.filter(r => r.severity === 'info').length}\n\n` +
        perFileResults.filter(fr => fr.results.length > 0).map(fr =>
          `### ${fr.path} (${fr.results.length}条)\n` +
          fr.results.map(r => `[${r.severity.toUpperCase()}] ${r.category}: ${r.line.slice(0, 120)}`).join('\n')
        ).join('\n\n');
    } else {
      ruleSummary = ruleResults && ruleResults.length > 0
        ? `规则匹配发现 ${ruleResults.length} 个问题：\n` +
          `严重: ${ruleResults.filter(r => r.severity === 'critical').length} | ` +
          `警告: ${ruleResults.filter(r => r.severity === 'warning').length} | ` +
          `信息: ${ruleResults.filter(r => r.severity === 'info').length}\n\n` +
          ruleResults.slice(0, 20).map(r => `[${r.severity.toUpperCase()}] ${r.category}: ${r.line.slice(0, 100)}`).join('\n')
        : '规则匹配未发现问题。';
    }

    const prompt = `你是Linux服务器运维专家，擅长硬件问题诊断（硬盘慢盘、光模块异常、内存UCE错误等）和性能优化。
请基于以下逐文件扫描结果进行分析，识别: 1)硬件故障(硬盘/光模块/内存UCE) 2)性能问题 3)系统错误

## 逐文件扫描结果
${ruleSummary}

${logText ? '## 日志原文\n' + logText.slice(0, 4000) : ''}
输出: ##问题概述 ##硬件问题 ##性能分析 ##优化建议 ##监控指标`;

    const url = getApiUrl();
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    const body = JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.3, max_tokens: 2500 });

    const resp = await fetch(url, { method: 'POST', headers, body });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.error?.message || `API错误: ${resp.status}`); }
    const data = await resp.json();
    const content = data.choices[0]?.message?.content || '无输出';
    summaryDiv.innerHTML = `<h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg> LLM 分析结果</h3><pre>${escapeHtml(content)}</pre>`;
    chatHistory.push({ role: 'assistant', content });
  } catch (err) {
    const d = document.getElementById('llmSummary');
    d.className = 'llm-summary error';
    d.innerHTML = `<h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> 分析失败</h3><pre>${escapeHtml(err.message)}</pre>`;
  } finally { document.getElementById('mainBtn').disabled = false; }
}

async function sendChat() {
  const input = document.getElementById('chatInput'), msg = input.value.trim();
  if (!msg) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('请先输入 API Key'); return; }
  apiBaseUrl = document.getElementById('apiUrl').value.trim();
  const msgsDiv = document.getElementById('chatMessages');
  document.getElementById('chatSection').style.display = 'block';
  document.getElementById('llmSummary').style.display = 'none';
  chatHistory.push({ role: 'user', content: msg });
  msgsDiv.innerHTML += `<div class="chat-msg user"><strong>你:</strong><pre>${escapeHtml(msg)}</pre></div>`;
  input.value = '';
  const loading = document.createElement('div'); loading.className = 'chat-msg assistant'; loading.innerHTML = '<span class="spinner"></span> 分析中...';
  msgsDiv.appendChild(loading); msgsDiv.scrollTop = msgsDiv.scrollHeight;
  try {
    const model = document.getElementById('modelSelect').value;
    const systemPrompt = currentFiles.length > 0
      ? `你是Linux服务器运维专家。已分析 ${currentFiles.length} 个文件，扫描到 ${currentResults.length} 个问题。\n${
          currentResults.slice(0, 30).map(r => `[${r.severity.toUpperCase()}] ${r.category}: ${r.line.slice(0, 100)}`).join('\n')
        }\n请结合上下文回答。`
      : `你是Linux服务器运维专家。当前日志:\n${currentLogText ? currentLogText.slice(0, 3000) : ''}\n请结合上下文回答。`;
    const url = getApiUrl();
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    const body = JSON.stringify({ model, messages: [{ role: 'system', content: systemPrompt }, ...chatHistory], temperature: 0.3, max_tokens: 1500 });
    const resp = await fetch(url, { method: 'POST', headers, body });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.error?.message || `API错误: ${resp.status}`); }
    const data = await resp.json();
    const content = data.choices[0]?.message?.content || '无输出';
    chatHistory.push({ role: 'assistant', content });
    loading.innerHTML = `<strong>助手:</strong><pre>${escapeHtml(content)}</pre>`;
  } catch (err) { loading.className = 'chat-msg error'; loading.innerHTML = `<strong>错误:</strong><pre>${escapeHtml(err.message)}</pre>`; }
  msgsDiv.scrollTop = msgsDiv.scrollHeight;
}

function clearChat() { chatHistory = []; document.getElementById('chatMessages').innerHTML = ''; document.getElementById('chatSection').style.display = 'none'; }
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function clearAll() {
  document.getElementById('logInput').value = '';
  document.getElementById('logInput').style.display = '';
  document.getElementById('archiveDisplay').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  document.getElementById('stats').innerHTML = '';
  document.getElementById('llmSummary').style.display = 'none';
  document.getElementById('chatSection').style.display = 'none';
  document.getElementById('fileInfo').innerHTML = '拖拽日志文件到此处，或点击选择文件';
  currentResults = []; currentLogText = ''; chatHistory = [];
  currentArchive = null; currentFiles = [];
}

function exportReport() {
  const fmt = document.getElementById('exportFormat').value;
  const r = document.getElementById('results');
  const l = document.getElementById('llmSummary');
  if (!r.innerText && !l.innerText) { alert('没有可导出的分析结果'); return; }
  const date = new Date().toLocaleString();
  const dateStr = new Date().toISOString().slice(0,10);

  if (fmt === 'md') {
    let c = '# LogScope 分析报告\n\n';
    c += '> 生成时间: ' + date + '\n\n';
    const s = document.getElementById('stats');
    if (s.innerText) {
      const lines = s.innerText.split('\n');
      c += '## 统计概览\n\n';
      c += '| 严重 | 警告 | 信息 |\n';
      c += '|------|------|------|\n';
      c += '| ' + lines[0] + ' | ' + lines[1] + ' | ' + lines[2] + ' |\n\n';
    }
    if (r.innerText) {
      c += '## 规则匹配结果\n\n';
      r.querySelectorAll('.issue-card').forEach(card => {
        const tag = card.querySelector('.tag');
        const sev = tag ? tag.className.replace('tag ','').replace('critical','🔴 严重').replace('warning','🟡 警告').replace('info','🟢 信息') : '';
        const content = card.querySelector('.content').innerText;
        const suggestion = card.querySelector('.suggestion')?.innerText || '';
        const header = card.querySelector('.header').innerText.replace(/\n/g,' ').replace(sev,'').trim();
        c += '### ' + header + ' ' + sev + '\n\n';
        c += '```\n' + content + '\n```\n\n';
        c += '> 💡 ' + suggestion.replace('💡 ','') + '\n\n';
      });
    }
    if (l.innerText && l.style.display !== 'none') {
      c += '## LLM 分析结果\n\n';
      c += '```\n' + l.innerText + '\n```\n\n';
    }
    c += '\n---\n> ⚠️ **免责声明**: 分析结果由 AI 生成，仅供参考。实际问题排查请结合日志原始内容自行判断。\n';
    const blob = new Blob([c], { type: 'text/markdown' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'log-analysis-' + dateStr + '.md'; a.click();
  } else {
    let c = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>LogScope 分析报告</title>';
    c += '<style>';
    c += 'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3;}';
    c += 'h1{color:#58a6ff;border-bottom:1px solid #30363d;padding-bottom:10px;}';
    c += 'h2{color:#58a6ff;margin-top:30px;}';
    c += 'h3{color:#8b949e;margin-top:20px;}';
    c += '.meta{color:#8b949e;font-size:0.9em;margin-bottom:20px;}';
    c += '.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0;}';
    c += '.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;text-align:center;}';
    c += '.stat .num{font-size:2em;font-weight:bold;}';
    c += '.stat.critical .num{color:#f85149;}.stat.warning .num{color:#d29922;}.stat.info .num{color:#3fb950;}';
    c += '.issue{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin:12px 0;border-left:4px solid;}';
    c += '.issue.critical{border-color:#f85149;}.issue.warning{border-color:#d29922;}.issue.info{border-color:#3fb950;}';
    c += '.issue-header{display:flex;justify-content:space-between;margin-bottom:10px;}';
    c += '.tag{padding:4px 10px;border-radius:6px;font-size:0.8em;font-weight:bold;}';
    c += '.tag.critical{background:#f85149;color:#fff;}.tag.warning{background:#d29922;color:#000;}.tag.info{background:#3fb950;color:#fff;}';
    c += '.content{color:#8b949e;font-family:monospace;font-size:0.9em;word-break:break-all;margin:10px 0;}';
    c += '.suggestion{background:#21262d;padding:12px;border-radius:6px;color:#58a6ff;font-size:0.9em;}';
    c += '.llm{background:#161b22;border:1px solid #58a6ff;border-radius:8px;padding:20px;margin-top:20px;}';
    c += '.llm pre{white-space:pre-wrap;word-break:break-all;background:#0d1117;padding:15px;border-radius:6px;}';
    c += 'blockquote{color:#8b949e;border-left:3px solid #30363d;margin:10px 0;padding-left:15px;}';
    c += '</style></head><body>';
    c += '<h1>LogScope 分析报告</h1>';
    c += '<div class="meta">生成时间: ' + date + '</div>';
    const s = document.getElementById('stats');
    if (s.innerText) {
      const lines = s.innerText.split('\n');
      c += '<div class="stats">';
      c += '<div class="stat critical"><div class="num">' + lines[0] + '</div><div>严重</div></div>';
      c += '<div class="stat warning"><div class="num">' + lines[1] + '</div><div>警告</div></div>';
      c += '<div class="stat info"><div class="num">' + lines[2] + '</div><div>信息</div></div>';
      c += '</div>';
    }
    if (r.innerHTML) {
      c += '<h2>规则匹配结果</h2>';
      r.querySelectorAll('.issue-card').forEach(card => {
        const tag = card.querySelector('.tag');
        const sev = tag ? tag.className.replace('tag ','') : '';
        const header = card.querySelector('.header').innerText;
        const content = card.querySelector('.content').innerText;
        const suggestion = card.querySelector('.suggestion')?.innerText || '';
        c += '<div class="issue ' + sev + '">';
        c += '<div class="issue-header"><span>' + header + '</span><span class="tag ' + sev + '">' + sev + '</span></div>';
        c += '<div class="content">' + content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
        c += '<div class="suggestion">💡 ' + suggestion.replace('💡 ','') + '</div>';
        c += '</div>';
      });
    }
    if (l.innerText && l.style.display !== 'none') {
      c += '<div class="llm"><h2>LLM 分析结果</h2><pre>' + l.innerText.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre></div>';
    }
    c += '<div style="text-align:center;color:#8b949e;font-size:0.8em;padding:20px 0;margin-top:30px;border-top:1px solid #30363d;">⚠️ 免责声明: 分析结果由 AI 生成，仅供参考。实际问题排查请结合日志原始内容自行判断。</div>';
    c += '</body></html>';
    const blob = new Blob([c], { type: 'text/html' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'log-analysis-' + dateStr + '.html'; a.click();
  }
}

function saveConfig() {
  const k = document.getElementById('apiKey').value.trim(), m = document.getElementById('modelSelect').value, u = document.getElementById('apiUrl').value.trim();
  if (k) localStorage.setItem('llm_api_key', k);
  if (m) localStorage.setItem('llm_model', m);
  if (u) localStorage.setItem('llm_api_url', u); else localStorage.removeItem('llm_api_url');
  alert('配置已保存');
}

function loadConfig() {
  const k = localStorage.getItem('llm_api_key'), m = localStorage.getItem('llm_model'), u = localStorage.getItem('llm_api_url');
  if (k) document.getElementById('apiKey').value = k;
  if (m) document.getElementById('modelSelect').value = m;
  if (u) document.getElementById('apiUrl').value = u;
}
loadConfig();
loadHistory();

// Theme switcher
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.theme = btn.dataset.theme;
    localStorage.setItem('theme', btn.dataset.theme);
  });
});
const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  document.body.dataset.theme = savedTheme;
  document.querySelectorAll('.theme-btn').forEach(b => { b.classList.toggle('active', b.dataset.theme === savedTheme); });
}

// File upload
const dropZone = document.getElementById('dropZone'), fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) readFile(e.target.files[0]); });

// Load upload history
function loadHistory() {
  fetch('/api/history')
    .then(r => r.json())
    .then(data => {
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');
      const count = document.getElementById('historyCount');
      if (data.history && data.history.length > 0) {
        section.style.display = 'block';
        count.textContent = '(' + data.history.length + ')';
        list.innerHTML = data.history.map(h => `
          <div class="history-item" onclick="loadHistoryItem(${h.id})" style="cursor:pointer;padding:8px 12px;margin:4px 0;background:var(--bg-tertiary);border-radius:6px;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:0.9em;color:var(--text-secondary);">${escapeHtml(h.filename)}</span>
            <span style="font-size:0.8em;color:var(--text-muted);">${formatSize(h.content_size)}</span>
          </div>
        `).join('');
      } else {
        section.style.display = 'none';
      }
    })
    .catch(() => {});
}

// Load a specific history item
function loadHistoryItem(id) {
  fetch('/api/history/' + id)
    .then(r => r.json())
    .then(item => {
      if (item && item.filename) {
        clearAll();
        if (item.is_archive) {
          document.getElementById('logInput').style.display = 'none';
          document.getElementById('archiveDisplay').style.display = 'block';
          document.getElementById('archiveDisplay').innerHTML = '<pre class="tree-view">' + escapeHtml(item.preview) + '</pre>';
          currentArchive = item;
        } else {
          document.getElementById('logInput').value = item.preview;
          currentLogText = item.preview;
        }
        document.getElementById('fileInfo').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg> 历史: <strong>' + escapeHtml(item.filename) + '</strong> (' + formatSize(item.content_size || 0) + ')';
      }
    })
    .catch(() => {});
}

function readFile(file) {
  const formData = new FormData();
  formData.append('file', file);
  const fileInfo = document.getElementById('fileInfo');
  fileInfo.innerHTML = '<span class="spinner"></span> 上传并解压中...';
  fetch('/api/upload', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        if (data.type === 'archive') {
          currentArchive = data;
          currentFiles = data.files;
          currentLogText = '';
          currentResults = []; chatHistory = [];
          document.getElementById('logInput').style.display = 'none';
          document.getElementById('logInput').value = '';
          document.getElementById('results').innerHTML = '';
          document.getElementById('stats').innerHTML = '';
          document.getElementById('llmSummary').style.display = 'none';
          const archiveDiv = document.getElementById('archiveDisplay');
          archiveDiv.style.display = 'block';
          archiveDiv.innerHTML = `<div style="margin-bottom:8px;color:var(--accent);font-weight:600;">${escapeHtml(data.filename)} <span style="color:var(--text-secondary);font-weight:400;font-size:0.85em;">(${data.file_count} 个文件, ${formatSize(data.size)})</span></div>
            <pre class="tree-view">${escapeHtml(data.tree)}</pre>`;
          fileInfo.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 已解压: <strong>' + escapeHtml(data.filename) + '</strong> — ' + data.file_count + ' 个文件';
        } else {
          currentArchive = null;
          currentFiles = [];
          currentLogText = data.content;
          document.getElementById('archiveDisplay').style.display = 'none';
          document.getElementById('logInput').style.display = '';
          document.getElementById('logInput').value = data.content;
          document.getElementById('results').innerHTML = '';
          document.getElementById('stats').innerHTML = '';
          document.getElementById('llmSummary').style.display = 'none';
          fileInfo.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 已上传: <strong>' + escapeHtml(file.name) + '</strong> (' + formatSize(data.content_size) + ')';
        }
      } else {
        fileInfo.innerHTML = '<span style="color:var(--danger)">解压失败: ' + escapeHtml(data.error || '未知错误') + '</span>';
      }
    })
    .catch(err => {
      fileInfo.innerHTML = '<span style="color:var(--danger)">上传失败: ' + escapeHtml(err.message) + '</span>';
    });
}

// Format bytes to human readable
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });

// Download collect script
function downloadCollectScript() {
  const days = document.getElementById('historyDays').value, level = document.getElementById('collectLevel').value;
  const script = generateScript(days, level);
  const b = new Blob([script], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = `linux-os-log-collect-d${days}-${level}.sh`; a.click();
}

function generateScript(days, level) {
  const L = [];
  L.push('#!/bin/bash'); L.push('# Linux OS Log Collector - Auto-generated'); L.push('# Generated: ' + new Date().toISOString());
  L.push('# History: ' + days + ' days | Level: ' + level); L.push('');
  L.push('set -euo pipefail'); L.push('TMPDIR=$(mktemp -d /tmp/log_collector.XXXXXX)');
  L.push('trap "rm -rf $TMPDIR 2>/dev/null || true" EXIT'); L.push('');
  L.push('DEST="/tmp/system-logs-$(hostname)-$(date +%Y%m%d_%H%M%S).tar.gz"');
  L.push('echo "========================================"'); L.push('echo "历史: ' + days + '天 | 级别: ' + level + '"');
  L.push('echo "输出: $DEST"'); L.push('echo "========================================"'); L.push('');
  L.push('# === 系统信息 ==='); L.push('uname -a > "$TMPDIR/01_system_info.txt"');
  L.push('uptime >> "$TMPDIR/01_system_info.txt"'); L.push('free -h >> "$TMPDIR/01_system_info.txt"');
  L.push('df -h >> "$TMPDIR/01_system_info.txt"'); L.push('cat /proc/cpuinfo | grep -E "model name|cpu cores" >> "$TMPDIR/01_system_info.txt" 2>/dev/null || true');
  L.push(''); L.push('# === 硬件日志 ==='); L.push('dmesg -T > "$TMPDIR/02_dmesg.log" 2>/dev/null || dmesg > "$TMPDIR/02_dmesg.log"');
  L.push('cat /var/log/dmesg* > "$TMPDIR/02_dmesg.old" 2>/dev/null || true');
  if (level === 'hardware' || level === 'full') {
    L.push('dmidecode > "$TMPDIR/03_hardware.txt" 2>/dev/null || echo "[SKIP: need root]"');
    L.push('lspci -vvv > "$TMPDIR/04_pci.txt" 2>/dev/null || echo "[SKIP: need root]"');
  }
  L.push('lsblk -a > "$TMPDIR/05_block_devices.txt"');
  L.push('cat /proc/diskstats > "$TMPDIR/06_diskstats.txt"');
  if (level === 'hardware' || level === 'full') {
    L.push(''); L.push('# === SMART ===');
    L.push('smartctl --scan > "$TMPDIR/07_smart_devices.txt" 2>/dev/null || true');
    L.push('for dev in $(lsblk -d -n -o NAME | grep -E \'^sd|^nvme\' 2>/dev/null); do');
    L.push('  [[ -b "/dev/$dev" ]] && smartctl -a "/dev/$dev" > "$TMPDIR/08_smart_$dev.txt" 2>/dev/null || true');
    L.push('done');
    L.push('cat /proc/mdstat > "$TMPDIR/09_raid_status.txt" 2>/dev/null || true');
  }
  L.push('lsblk -f > "$TMPDIR/10_filesystems.txt"');
  L.push(''); L.push('# === 内存 ===');
  L.push('cat /proc/meminfo > "$TMPDIR/11_memory.txt"');
  L.push('dmesg | grep -i -E "memory|uce|err|correctable" > "$TMPDIR/12_mem_errors.txt" 2>/dev/null || true');
  if (level === 'full') {
    L.push('cat /proc/buddyinfo > "$TMPDIR/13_buddyinfo.txt" 2>/dev/null || true');
  }
  L.push(''); L.push('# === 网络 ===');
  L.push('ip addr > "$TMPDIR/14_ip_addr.txt"');
  L.push('ip link > "$TMPDIR/15_ip_link.txt"');
  L.push('ip -s link > "$TMPDIR/16_ip_link_stats.txt"');
  L.push('cat /proc/net/dev > "$TMPDIR/17_net_dev.txt"');
  L.push('ss -tuln > "$TMPDIR/18_ss_ports.txt" 2>/dev/null || true');
  if (level === 'hardware' || level === 'full') {
    L.push('NET_DEV=$(ip -o link show | grep -v lo | head -1 | awk -F: \'{print $2}\' | tr -d \' \')');
    L.push('[[ -n "$NET_DEV" ]] && ethtool -g "$NET_DEV" > "$TMPDIR/19_ethtool_ring.txt" 2>/dev/null || true');
  }
  L.push(''); L.push('# === 光模块/光纤 ===');
  L.push('ls -l /sys/class/net/ > "$TMPDIR/20_net_class.txt"');
  L.push('cat /sys/class/net/*/speed > "$TMPDIR/21_net_speed.txt" 2>/dev/null || true');
  L.push('dmesg | grep -i -E "optical|fiber|sfp|sfpp|sff|module|link" > "$TMPDIR/22_optical.log" 2>/dev/null || true');
  L.push(''); L.push('# === IO/CPU 性能 ===');
  L.push('iostat -x 2 5 > "$TMPDIR/23_iostat.txt" 2>/dev/null || echo "[iostat SKIP: need sysstat]"');
  L.push('mpstat -A 2 3 > "$TMPDIR/24_mpstat.txt" 2>/dev/null || echo "[mpstat SKIP: need sysstat]"');
  if (level === 'full') {
    L.push('pidstat -u 2 5 > "$TMPDIR/25_pidstat.txt" 2>/dev/null || echo "[pidstat SKIP: need sysstat]"');
    L.push('which nmon >/dev/null 2>&1 && nmon -f -s 1 -c 10 -m "$TMPDIR/" 2>/dev/null &');
  }
  L.push('sleep 12');
  L.push('ps aux --no-headers > "$TMPDIR/26_processes.txt"');
  L.push('top -bn1 -o %MEM | head -30 > "$TMPDIR/27_top_mem.txt"');
  if (level === 'full') {
    L.push('top -bn1 -o %CPU | head -30 > "$TMPDIR/28_top_cpu.txt"');
  }
  L.push(''); L.push('# === 历史日志 ===');
  L.push('journalctl -k --no-pager > "$TMPDIR/30_kernel.log" 2>/dev/null || echo "[journalctl SKIP: need root]"');
  L.push('journalctl -p err --no-pager > "$TMPDIR/31_errors.log" 2>/dev/null || true');
  if (level === 'full') {
    L.push('journalctl -p warning --since "-' + days + ' days" --no-pager > "$TMPDIR/32_warnings.log" 2>/dev/null || true');
  }
  L.push('cp /var/log/syslog "$TMPDIR/33_syslog.txt" 2>/dev/null || true');
  L.push('cp /var/log/messages "$TMPDIR/33_messages.txt" 2>/dev/null || true');
  L.push(''); L.push('# === 网络连接 ===');
  L.push('netstat -ant > "$TMPDIR/34_netstat_tcp.txt" 2>/dev/null || true');
  L.push('netstat -anu > "$TMPDIR/35_netstat_udp.txt" 2>/dev/null || true');
  L.push('ss -s > "$TMPDIR/36_ss_summary.txt" 2>/dev/null || true');
  L.push(''); L.push('# === 打包 ===');
  L.push('tar -czf "$DEST" -C "$(dirname "$TMPDIR")" "$(basename "$TMPDIR")"');
  L.push(''); L.push('echo "=== 完成 ==="'); L.push('echo "文件: $DEST"');
  L.push('echo "大小: $(du -h "$DEST" | cut -f1)"');
  L.push('echo "时间: $(date)"');
  return L.join('\n');
}

  const dropdown = document.querySelector('.about-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
